name: Update Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version (e.g. 0.1.0-alpha.12)
        required: false
        type: string
  repository_dispatch:
    types: [infimount-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Resolve version input
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "value=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update formula and cask
        id: formula
        run: ./scripts/update-formula.sh "${{ steps.resolve.outputs.value }}"

      - name: Validate formula and cask
        run: |
          set -euo pipefail
          version="${{ steps.formula.outputs.version }}"
          tag="v${version}"
          grep -Fq "version \"${version}\"" Formula/infimount.rb
          grep -Fq "version \"${version}\"" Casks/infimount.rb
          grep -Fq "releases/download/${tag}/Infimount-x86_64.AppImage" Formula/infimount.rb
          appimage_sha="$(curl -fsSL "https://github.com/infimount/infimount/releases/download/${tag}/Infimount-x86_64.AppImage.sha256" | awk '{print $1}')"
          dmg_sha="$(curl -fsSL "https://github.com/infimount/infimount/releases/download/${tag}/Infimount.dmg.sha256" | awk '{print $1}')"
          grep -Fq "sha256 \"${appimage_sha}\"" Formula/infimount.rb
          grep -Fq "sha256 \"${dmg_sha}\"" Casks/infimount.rb
          git diff --check

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No formula or cask changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/infimount.rb Casks/infimount.rb scripts/update-formula.sh
          git commit -m "chore(tap): update infimount to v${{ steps.formula.outputs.version }}"
          git push
